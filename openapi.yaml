openapi: 3.0.0
info:
  title: Portfolio API
  version: 1.0.0
paths:
  /api/hello:
    get:
      summary: Returns a greeting message
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello from the API!
